version: 2
updates:
  - package-ecosystem: "npm"        # gilt auch für pnpm und yarn
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-deps:
        patterns: ["*"]             # alles in einem PR statt einem PR pro Paket
    ignore:
      # typescript-eslint (via eslint-config-next) unterstützt nur TS < 6.1
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
