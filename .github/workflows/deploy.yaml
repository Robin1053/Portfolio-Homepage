name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Laeuft ein Deploy noch, wird er durch den neueren abgeloest.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Next-Build-Cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts','**/*.tsx','**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-next-

      - run: npm ci --prefer-offline --no-audit

      - run: npm run build
        env:
          NEXT_PUBLIC_IMPRESSUM_NAME: ${{ secrets.IMPRESSUM_NAME }}
          NEXT_PUBLIC_IMPRESSUM_STRASSE: ${{ secrets.IMPRESSUM_STRASSE }}
          NEXT_PUBLIC_IMPRESSUM_ORT: ${{ secrets.IMPRESSUM_ORT }}
          NEXT_PUBLIC_IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}

      - name: SSH vorbereiten
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Bevorzugt den hinterlegten Hostkey; ohne Secret bleibt es
          # bei TOFU per keyscan (schwaecher, aber lauffaehig).
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS nicht gesetzt - Hostkey wird ungeprueft uebernommen"
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Dateien zusammenstellen
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          [ -d public ] && cp -r public deploy/public || true

      - name: Übertragen
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/portfolio/

      - name: Neustart
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'sudo systemctl restart portfolio'

      - name: Erreichbarkeit pruefen
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://robineb.de/ || true)
            if [ "$code" = "200" ]; then
              echo "Seite antwortet mit 200"
              exit 0
            fi
            echo "Versuch $i: HTTP $code - warte..."
            sleep 5
          done
          echo "::error::Seite antwortet nach dem Deploy nicht mit 200"
          exit 1
