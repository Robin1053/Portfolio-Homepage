name: CI

on:
    push:
      # main nicht: dort laeuft der Deploy-Workflow, und da Merges
      # Fast-Forwards sind, wurde derselbe Commit auf dev schon geprueft.
      branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit      
      - run: npm run lint
      - run: npm run build